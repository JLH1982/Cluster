# Install (or optionally upgrade) k3s on one node. Expects k3s_role (server|agent) and k3s_first.
- name: Check installed k3s version
  ansible.builtin.shell: /usr/local/bin/k3s --version 2>/dev/null | awk 'NR==1{print $3}'
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether to install
  ansible.builtin.set_fact:
    k3s_fresh: "{{ k3s_installed.stdout == '' }}"
    k3s_do_install: "{{ k3s_installed.stdout == '' or (k3s_allow_upgrade | bool and k3s_installed.stdout != k3s_version) }}"

- name: Report version drift
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} runs k3s {{ k3s_installed.stdout }} but k3s_version is {{ k3s_version }}.
      Leaving it alone; re-run with -e k3s_allow_upgrade=true to upgrade (one node at a time).
  when: not k3s_do_install and k3s_installed.stdout != k3s_version

- name: Create the k3s config folder
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when: k3s_fresh

- name: Write k3s config (new installs only; existing configs are never rewritten)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      {% if k3s_role == 'server' and k3s_first %}
      cluster-init: true
      {% else %}
      server: {{ k3s_api }}
      {% endif %}
      token: {{ vault_k3s_token }}
      node-ip: {{ ansible_host }}
      {% if k3s_role == 'server' %}
      tls-san:
        - {{ ansible_host }}
      disable:
        - traefik
        - servicelb
      {% endif %}
  no_log: true
  when: k3s_fresh

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /root/k3s-install.sh
    mode: "0700"
  when: k3s_do_install

- name: Install k3s {{ k3s_version }} ({{ k3s_role }})
  ansible.builtin.command: /root/k3s-install.sh {{ k3s_role }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_do_install

- name: Wait for the node to be Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl --kubeconfig {{ kubeconfig }} wait --for=condition=Ready
    node/{{ inventory_hostname }} --timeout=300s
  delegate_to: "{{ k3s_init_host }}"
  changed_when: false
  when: k3s_do_install and not ansible_check_mode
