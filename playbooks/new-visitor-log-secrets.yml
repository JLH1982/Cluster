# One time only: create the visitor log's database passwords (and Cloudflare token) and the database
# backup passphrase on the running cluster, so that
# create-vault.yml can copy them into the vault. Afterwards the vault is the source, as for every
# other secret, and this playbook is not needed again (not even for a rebuild).
#   ansible-playbook playbooks/new-visitor-log-secrets.yml
#   ansible-playbook playbooks/create-vault.yml
# The passwords and the backup passphrase are random. Asks for a Cloudflare API token (My Profile >
# API Tokens > Custom token) with two permissions: Zone > Analytics > Read (zone hinkel-net.com), so
# the visitor log can read the requests Cloudflare answered itself (www login page, blocked bots),
# and Account > Account Filter Lists > Edit, so it can fill the honeypot_attackers block list.
# Leave it empty to skip both.
# Secrets that already exist are left alone.
- name: Create the visitor log secrets
  hosts: k3s_init
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  vars_prompt:
    - name: cloudflare_token
      prompt: "Cloudflare API token (Zone Analytics Read + Account Filter Lists Edit; empty to skip)"
      private: true
  tasks:
    - name: Create the secrets that don't exist yet
      ansible.builtin.shell: |
        set -e
        rand() { openssl rand -base64 "$1" | tr -d '\n/+=' ; }
        made=""
        for ns in visitor-log db-backup; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        done
        # Encrypts the nightly database dumps in S3 (files/apps/db-backup.yaml); needed for a restore
        if ! kubectl -n db-backup get secret db-backup-passphrase >/dev/null 2>&1; then
          kubectl -n db-backup create secret generic db-backup-passphrase --from-literal=passphrase="$(rand 48)" >/dev/null
          made="$made db-backup-passphrase"
        fi
        for s in visitor-log-db:visitorlog visitor-log-grafana:grafana; do
          name=${s%%:*}; user=${s#*:}
          if ! kubectl -n visitor-log get secret "$name" >/dev/null 2>&1; then
            kubectl -n visitor-log create secret generic "$name" --type=kubernetes.io/basic-auth \
              --from-literal=username="$user" --from-literal=password="$(rand 32)" >/dev/null
            made="$made $name"
          fi
        done
        if [ -n "$CF_TOKEN" ] && ! kubectl -n visitor-log get secret visitor-log-cloudflare >/dev/null 2>&1; then
          kubectl -n visitor-log create secret generic visitor-log-cloudflare \
            --from-literal=api-token="$CF_TOKEN" --from-literal=zone-id="$CF_ZONE" \
            --from-literal=account-id="$CF_ACCOUNT" --from-literal=list-id="$CF_LIST" >/dev/null
          made="$made visitor-log-cloudflare"
        fi
        echo "created:${made:- nothing}"
      environment:
        CF_TOKEN: "{{ cloudflare_token }}"
        CF_ZONE: <your-zone-id>      # hinkel-net.com
        CF_ACCOUNT: <your-account-id>
        CF_LIST: <your-ip-list-id>      # IP list honeypot_attackers
      register: made
      changed_when: "'nothing' not in made.stdout"
      no_log: true

    - name: Next step
      ansible.builtin.debug:
        msg: "{{ made.stdout }}. Now run: ansible-playbook playbooks/create-vault.yml"
