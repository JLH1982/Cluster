# One time only: create the secrets for cert-manager and Authentik on the running cluster, so that
# create-vault.yml can copy them into the vault. Afterwards the vault is the source, as for every
# other secret, and this playbook is not needed again (not even for a rebuild).
#   ansible-playbook playbooks/new-sso-secrets.yml
#   ansible-playbook playbooks/create-vault.yml
# Asks for the Cloudflare API token (My Profile > API Tokens > "Edit zone DNS" template, zone
# hinkel-net.com). The Authentik keys are random. Secrets that already exist are left alone.
- name: Create the cert-manager and Authentik secrets
  hosts: k3s_init
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  vars_prompt:
    - name: cloudflare_token
      prompt: "Cloudflare API token (DNS edit, hinkel-net.com only)"
      private: true
  tasks:
    - name: Create the secrets that don't exist yet
      ansible.builtin.shell: |
        set -e
        rand() { openssl rand -base64 "$1" | tr -d '\n/+=' ; }
        made=""
        for ns in cert-manager authentik; do
          kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
        done
        if ! kubectl -n cert-manager get secret cloudflare-api-token >/dev/null 2>&1; then
          [ -n "$CF_TOKEN" ] || { echo "No Cloudflare token entered" >&2; exit 1; }
          kubectl -n cert-manager create secret generic cloudflare-api-token --from-literal=api-token="$CF_TOKEN" >/dev/null
          made="$made cloudflare-api-token"
        fi
        if ! kubectl -n authentik get secret authentik-postgres-secret >/dev/null 2>&1; then
          kubectl -n authentik create secret generic authentik-postgres-secret --type=kubernetes.io/basic-auth \
            --from-literal=username=authentik --from-literal=password="$(rand 32)" >/dev/null
          made="$made authentik-postgres-secret"
        fi
        if ! kubectl -n authentik get secret authentik-secrets >/dev/null 2>&1; then
          kubectl -n authentik create secret generic authentik-secrets \
            --from-literal=AUTHENTIK_SECRET_KEY="$(rand 60)" --from-literal=GRAFANA_OIDC_SECRET="$(rand 48)" >/dev/null
          made="$made authentik-secrets"
        fi
        echo "created:${made:- nothing}"
      environment:
        CF_TOKEN: "{{ cloudflare_token }}"
      register: made
      changed_when: "'nothing' not in made.stdout"
      no_log: true

    - name: Next step
      ansible.builtin.debug:
        msg: "{{ made.stdout }}. Now run: ansible-playbook playbooks/create-vault.yml"
