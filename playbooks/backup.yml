# Back up app data from the cluster to this laptop (backups/<timestamp>/).
#   ansible-playbook playbooks/backup.yml
# Contents: Immich and Authentik databases, Home Assistant config, Z-Wave store, Uptime Kuma data,
# both websites' files, and an etcd snapshot (all Kubernetes objects, secrets included).
# NOT included: Immich photo files - those go to S3 nightly (immich-s3-backup CronJob).
# At the end, this folder + the new backup are encrypted and uploaded to S3 (offsite_bucket).
- name: Back up cluster data
  hosts: k3s_init
  become: true
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  vars:
    dest: "{{ backup_dir_remote }}/{{ stamp }}"
    pvc_backups:
      - {file: home-assistant.tgz, ns: home-assistant, deploy: home-assistant, container: home-assistant, path: /config}
      - {file: zwave-js-ui.tgz, ns: home-assistant, deploy: zwave-js-ui, container: zwave-js-ui, path: /usr/src/app/store}
      - {file: uptime-kuma.tgz, ns: uptime-kuma, deploy: uptime-kuma, container: uptime-kuma, path: /app/data}
      - {file: darkweb-site.tgz, ns: darkweb, deploy: darkweb-website, container: nginx, path: /usr/share/nginx/html}
      - {file: website.tgz, ns: default, deploy: website, container: nginx, path: /usr/share/nginx/html}
  tasks:
    - name: Pick the backup name
      ansible.builtin.set_fact:
        stamp: "{{ lookup('pipe', 'date +%Y-%m-%d-%H%M') }}"

    - name: Create the local backup folder (private - it contains secrets)
      ansible.builtin.file:
        path: "{{ backup_dir_local }}/{{ stamp }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Create {{ dest }}
      ansible.builtin.file:
        path: "{{ dest }}"
        state: directory
        mode: "0700"

    - name: Find the Immich database primary
      ansible.builtin.command: >-
        kubectl -n immich get clusters.postgresql.cnpg.io immich-database -o jsonpath={.status.currentPrimary}
      register: pg_primary
      changed_when: false

    - name: Dump the Immich database
      ansible.builtin.shell: >-
        kubectl -n immich exec {{ pg_primary.stdout }} -c postgres -- pg_dump -U postgres -d immich -Fc
        > {{ dest }}/immich-db.dump && test -s {{ dest }}/immich-db.dump

    - name: Find the Authentik database primary
      ansible.builtin.command: >-
        kubectl -n authentik get clusters.postgresql.cnpg.io authentik-database -o jsonpath={.status.currentPrimary}
      register: ak_primary
      changed_when: false

    - name: Dump the Authentik database (users, MFA devices)
      ansible.builtin.shell: >-
        kubectl -n authentik exec {{ ak_primary.stdout }} -c postgres -- pg_dump -U postgres -d authentik -Fc
        > {{ dest }}/authentik-db.dump && test -s {{ dest }}/authentik-db.dump

    - name: Find the visitor log database primary
      ansible.builtin.command: >-
        kubectl -n visitor-log get clusters.postgresql.cnpg.io visitor-log-database -o jsonpath={.status.currentPrimary}
      register: vl_primary
      changed_when: false

    - name: Dump the visitor log database (portfolio visits)
      ansible.builtin.shell: >-
        kubectl -n visitor-log exec {{ vl_primary.stdout }} -c postgres -- pg_dump -U postgres -d visitorlog -Fc
        > {{ dest }}/visitor-log-db.dump && test -s {{ dest }}/visitor-log-db.dump

    - name: Archive app volumes
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl -n {{ item.ns }} exec deploy/{{ item.deploy }} -c {{ item.container }} --
        tar czf - --exclude=./lost+found -C {{ item.path }} . > {{ dest }}/{{ item.file }} && test -s {{ dest }}/{{ item.file }}
      args:
        executable: /bin/bash
      loop: "{{ pvc_backups }}"
      loop_control: {label: "{{ item.file }}"}

    - name: Snapshot etcd
      ansible.builtin.shell: |
        set -e
        k3s etcd-snapshot save --name ansible-backup >/dev/null 2>&1
        f=$(ls -t /var/lib/rancher/k3s/server/db/snapshots/ansible-backup-* | head -1)
        mv "$f" {{ dest }}/etcd-snapshot.db

    - name: List backup files
      ansible.builtin.find:
        paths: "{{ dest }}"
      register: backup_files

    - name: Copy the backup to this laptop
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ backup_dir_local }}/{{ stamp }}/"
        flat: true
      loop: "{{ backup_files.files }}"
      loop_control: {label: "{{ item.path | basename }}"}

    - name: Keep only the newest {{ backup_keep_remote }} backups on the master
      ansible.builtin.shell: >-
        ls -1d {{ backup_dir_remote }}/20*/ | sort | head -n -{{ backup_keep_remote }} | xargs -r rm -rf
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: "Backup saved to {{ (backup_dir_local ~ '/' ~ stamp) | realpath }}"

# Off-site copy: this project folder (scripts + encrypted vault) and the backup just taken, as one
# archive encrypted on the laptop with the Ansible vault password, uploaded to S3. The laptop's
# AWS profile can only upload (no list/read/delete); download copies from the AWS console.
# Restore: see REBUILD.md "Laptop gone?".
- name: Copy the project and this backup to S3
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    stamp: "{{ hostvars[groups['k3s_init'][0]].stamp }}"
    project_dir: "{{ (playbook_dir ~ '/..') | realpath }}"
    archive: "/tmp/cluster-ansible-{{ stamp }}.tar.gz.gpg"
  tasks:
    - name: Encrypt and upload cluster-ansible-{{ stamp }}.tar.gz.gpg
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        cd "{{ project_dir }}"
        tar -czf - $(ls -A | grep -vx backups) "backups/{{ stamp }}" |
          gpg --batch --yes --quiet --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase-file ~/.ansible/cluster-vault-pass -o "{{ archive }}"
        aws s3 cp --profile "{{ offsite_aws_profile }}" --only-show-errors --storage-class STANDARD_IA \
          "{{ archive }}" "s3://{{ offsite_bucket }}/cluster-ansible/cluster-ansible-{{ stamp }}.tar.gz.gpg"
        du -h "{{ archive }}" | cut -f1
      args:
        executable: /bin/bash
      register: offsite
      when: offsite_bucket | default('') | length > 0

    - name: Remove the local archive
      ansible.builtin.file:
        path: "{{ archive }}"
        state: absent

    - name: Off-site copy done
      ansible.builtin.debug:
        msg: "Uploaded {{ offsite.stdout | default('?') }} to s3://{{ offsite_bucket }}/cluster-ansible/cluster-ansible-{{ stamp }}.tar.gz.gpg"
      when: offsite is not skipped
