# Base OS setup for every Pi: packages, kernel settings, firewall, SSH/sudo hardening, logs, services,
# updates, Longhorn disk.
# Safe to re-run; changes that need a reboot are reported at the end.
- name: Prepare cluster hosts
  hosts: k3s_cluster
  become: true
  vars:
    cluster_ips: "{{ groups['k3s_cluster'] | map('extract', hostvars, 'ansible_host') | list }}"
    pi_config_common:
      - dtparam=pciex1
      - dtparam=pciex1_gen=3
      - max_usb_current_enable=1
      - kernel=kernel8.img
  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
    - name: Reboot needed
      ansible.builtin.set_fact:
        reboot_needed: true
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
    - name: Restart journald
      ansible.builtin.shell: systemctl restart systemd-journald && journalctl --flush
    - name: Reload fail2ban
      ansible.builtin.command: fail2ban-client reload
    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted
    - name: Regenerate swap units
      ansible.builtin.shell: systemctl daemon-reload && systemctl reset-failed
  tasks:
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Install packages
      ansible.builtin.apt:
        name: [open-iscsi, nfs-common, cryptsetup, fail2ban, ufw, curl, unattended-upgrades]
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Enable iSCSI (Longhorn) and fail2ban
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [iscsid, fail2ban]

    # ---- Kernel ----
    - name: Kernel modules loaded at boot
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/modules-load.d/
        mode: "0644"
      with_fileglob: ../files/host/modules-load/*.conf
      notify: Reboot needed

    - name: Load kernel modules now
      community.general.modprobe:
        name: "{{ item }}"
      loop: [iscsi_tcp, br_netfilter, overlay, nf_conntrack, dm_crypt]

    - name: Sysctl settings (k3s networking, IPv6 off)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/sysctl.d/
        mode: "0644"
      with_fileglob: ../files/host/sysctl/*.conf
      notify: Reload sysctl

    - name: Enable memory cgroups (required by k3s)
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^((?!.*cgroup_enable=memory).*?)\s*$'
        replace: '\1 cgroup_memory=1 cgroup_enable=memory'
      notify: Reboot needed

    - name: Pi firmware settings shared by all nodes
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        line: "{{ item }}"
      loop: "{{ pi_config_common }}"
      notify: Reboot needed

    - name: Disable Bluetooth (also fixes the old 'diable-bi' typo)
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: '^dtoverlay=(diable-bi|disable-bt)$'
        line: dtoverlay=disable-bt
      notify: Reboot needed

    - name: Pi firmware settings for this node
      ansible.builtin.lineinfile:
        path: /boot/firmware/config.txt
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop: "{{ pi_config | default({}) | dict2items }}"
      notify: Reboot needed

    # ---- Network ----
    - name: Find NetworkManager connections
      ansible.builtin.command: nmcli -g NAME,TYPE connection show
      register: nm_cons
      changed_when: false
      check_mode: false

    - name: Disable IPv6 on wired and Wi-Fi connections
      ansible.builtin.shell: |
        set -e
        if [ "$(nmcli -g ipv6.method connection show "$CON")" != disabled ]; then
          nmcli connection modify "$CON" ipv6.method disabled
          echo changed
        fi
      environment:
        CON: "{{ item.split(':')[0] }}"
      register: nm_ipv6
      changed_when: "'changed' in nm_ipv6.stdout"
      loop: "{{ nm_cons.stdout_lines | select('search', ':802-(3-ethernet|11-wireless)$') | reject('search', '^veth') | list }}"

    # ---- Firewall ----
    - name: Firewall defaults
      community.general.ufw:
        direction: "{{ item.dir }}"
        default: "{{ item.policy }}"
      loop:
        - {dir: incoming, policy: deny}
        - {dir: outgoing, policy: allow}
        - {dir: routed, policy: deny}

    - name: Allow SSH from the LAN and the VPN
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ssh_allowed_cidrs }}"

    - name: Remove the old allow-SSH-from-anywhere rule
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true

    - name: Allow Kubernetes API from the LAN
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp
        from_ip: "{{ lan_cidr }}"

    - name: Allow pod and service networks
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
      loop: ["{{ pod_cidr }}", "{{ service_cidr }}"]

    - name: Allow cluster traffic between nodes
      community.general.ufw:
        rule: allow
        port: "{{ item.0.port }}"
        proto: "{{ item.0.proto }}"
        from_ip: "{{ item.1 }}"
        comment: "{{ item.0.comment | default(omit) }}"
      loop: "{{ node_rules | product(cluster_ips) | list }}"
      vars:
        node_rules:
          - {port: "2379:2380", proto: tcp}
          - {port: "6443", proto: tcp}
          - {port: "10250", proto: tcp}
          - {port: "8472", proto: udp}
          - {port: "7946", proto: any}
          - {port: "9100", proto: tcp, comment: node-exporter}

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    # ---- SSH ----
    - name: Remove duplicate lines from authorized_keys
      ansible.builtin.shell: |
        f=/home/{{ ansible_user }}/.ssh/authorized_keys
        [ -f "$f" ] || exit 0
        awk '!seen[$0]++' "$f" > "$f.dedup"
        if cmp -s "$f" "$f.dedup"; then rm "$f.dedup"; else
          {% if ansible_check_mode %}rm "$f.dedup"{% else %}cat "$f.dedup" > "$f" && rm "$f.dedup"{% endif %}; echo changed
        fi
      register: dedup
      changed_when: "'changed' in dedup.stdout"
      check_mode: false

    - name: Look for SSH keys
      ansible.builtin.stat:
        path: /home/{{ ansible_user }}/.ssh/authorized_keys
      register: authkeys

    - name: Stop if there are no SSH keys (turning off passwords would lock you out)
      ansible.builtin.assert:
        that: authkeys.stat.exists and authkeys.stat.size > 0
        fail_msg: "No SSH keys for {{ ansible_user }} on {{ inventory_hostname }}. Add one with ssh-copy-id first."

    # 01- sorts before cloud-init's 50-cloud-init.conf, and sshd uses the first value it reads.
    - name: SSH hardening (keys only, no root, no X11)
      ansible.builtin.copy:
        src: ../files/host/sshd/01-hardening.conf
        dest: /etc/ssh/sshd_config.d/01-hardening.conf
        mode: "0644"
        validate: sshd -t -f %s
      notify: Reload SSH

    - name: Never ban your own devices in fail2ban
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (01-hosts.yml). *.local files are read after the Debian defaults.
          [DEFAULT]
          ignoreip = 127.0.0.1/8 {{ fail2ban_ignore_ips | join(' ') }}
        dest: /etc/fail2ban/jail.d/cluster.local
        mode: "0644"
      notify: Reload fail2ban

    # Bans then reach Grafana's "Cluster Problems" dashboard with the rest of the journal (Alloy)
    - name: Send fail2ban's log to the system journal
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (01-hosts.yml). Instead of /var/log/fail2ban.log.
          [Definition]
          logtarget = SYSTEMD-JOURNAL
        dest: /etc/fail2ban/fail2ban.d/cluster.local
        mode: "0644"
      notify: Restart fail2ban

    # A device banned on one Pi is banned on all four (read from Loki every minute; does nothing
    # until Loki is installed by 03-platform.yml)
    - name: Install the fail2ban ban sharing script
      ansible.builtin.template:
        src: ../files/host/fail2ban/fail2ban-cluster-sync.j2
        dest: /usr/local/sbin/fail2ban-cluster-sync
        mode: "0755"

    - name: Install the fail2ban ban sharing timer
      ansible.builtin.copy:
        src: "../files/host/fail2ban/{{ item }}"
        dest: /etc/systemd/system/
        mode: "0644"
      loop: [fail2ban-cluster-sync.service, fail2ban-cluster-sync.timer]
      register: f2b_sync_units

    - name: Start the fail2ban ban sharing timer
      ansible.builtin.systemd_service:
        name: fail2ban-cluster-sync.timer
        enabled: true
        state: started
        daemon_reload: "{{ f2b_sync_units is changed }}"

    # ---- Sudo ----
    # Raspberry Pi OS's 010_global-tty lets any session reuse a recent sudo; later files win.
    - name: Make sudo ask for the password per session
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (01-hosts.yml). Overrides 010_global-tty.
          Defaults timestamp_type=tty
        dest: /etc/sudoers.d/zz-cluster
        mode: "0440"
        validate: visudo -cf %s

    # ---- Logs ----
    - name: Keep the system journal on disk across reboots
      ansible.builtin.copy:
        src: ../files/host/journald/90-cluster.conf
        dest: /etc/systemd/journald.conf.d/
        mode: "0644"
      notify: Restart journald

    # ---- Swap ----
    - name: Swap configuration folder
      ansible.builtin.file:
        path: /etc/rpi/swap.conf.d
        state: directory
        mode: "0755"

    - name: No swap (Kubernetes runs without it)
      ansible.builtin.copy:
        src: ../files/host/swap/90-cluster.conf
        dest: /etc/rpi/swap.conf.d/
        mode: "0644"
      notify: Regenerate swap units

    # ---- Unused services ----
    # Bluetooth is off in firmware; avahi only publishes <host>.local names (Ansible and k3s use IPs);
    # udisks2 auto-mounts desktop USB drives.
    - name: Turn off Bluetooth, avahi and udisks2
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [bluetooth.service, avahi-daemon.socket, avahi-daemon.service, udisks2.service]

    # Only NFSv3 needs rpcbind; Longhorn's NFS backup target uses NFSv4.
    - name: Turn off rpcbind (port 111)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [rpcbind.socket, rpcbind.service]

    # ---- Updates ----
    # The stock Allowed-Origins match a=trixie-security, but Debian's archive is "stable-security",
    # so nothing was ever installed. Match on codename instead. Reboots (only when an update needs
    # one) happen at each Pi's reboot_time, staggered so etcd keeps quorum.
    - name: Automatic updates and reboots
      ansible.builtin.copy:
        content: |
          // Managed by Ansible (01-hosts.yml)
          Unattended-Upgrade::Origins-Pattern {
                  "origin=Debian,codename=${distro_codename},label=Debian";
                  "origin=Debian,codename=${distro_codename}-updates";
                  "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
                  "origin=Raspberry Pi Foundation,codename=${distro_codename}";
          };
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
          Unattended-Upgrade::Automatic-Reboot-Time "{{ reboot_time }}";
        dest: /etc/apt/apt.conf.d/52cluster-unattended-upgrades
        mode: "0644"

    - name: Install waiting updates now (-e apply_updates=true)
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
      when: apply_updates | default(false) | bool

    # ---- Longhorn disk ----
    - name: Look for the Longhorn disk
      ansible.builtin.command: "blkid -t {{ longhorn_disk.src }} -o device"
      register: lh_dev
      changed_when: false
      failed_when: false
      check_mode: false
      when: longhorn_disk is defined

    - name: Warn when the Longhorn disk is missing
      ansible.builtin.debug:
        msg: >-
          {{ longhorn_disk.src }} not found on {{ inventory_hostname }}. Plug the disk in, or format a
          new one with 'sudo mkfs.ext4 -L longhorn /dev/sdX' and set src to LABEL=longhorn in host_vars.
      when: longhorn_disk is defined and lh_dev.rc != 0

    - name: Mount the Longhorn disk
      ansible.posix.mount:
        src: "{{ longhorn_disk.src }}"
        path: "{{ longhorn_disk.path }}"
        fstype: ext4
        opts: "{{ longhorn_disk.opts }}"
        passno: "2"
        state: mounted
      when: longhorn_disk is defined and lh_dev.rc == 0

    - name: Run pending handlers
      ansible.builtin.meta: flush_handlers

    - name: Reboot reminder
      ansible.builtin.debug:
        msg: "Boot or kernel-module settings changed on {{ inventory_hostname }}: reboot it when convenient."
      when: reboot_needed | default(false)
