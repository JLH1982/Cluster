# Each Pi is on the same subnet twice (eth0 and wlan0). Only answer ARP for an address on the
# interface that owns it, so the network never learns a wired IP at the Wi-Fi MAC.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

# Debian's default of 128 inotify instances per user can run out with many pods watching files
# (shows up as "too many open files").
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
