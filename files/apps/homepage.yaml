# Homepage - link page for everything on the cluster
#   https://www.hinkel-net.com (Cloudflare tunnel, protected by Cloudflare Access)
#   https://home.lan.hinkel-net.com (home network and VPN, behind the Authentik login)
# Edit the HTML below and re-apply; the page updates within about a minute.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  namespace: homepage
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Hinkel-Net</title>
    <style>
      :root {
        --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #667085;
        --border: #e3e6ec; --accent: #2f6fed; --home: #b45309; --home-bg: #fef3c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11141a; --card: #1a1f27; --text: #e6e9ef; --muted: #98a2b3;
          --border: #2a313c; --accent: #6b9bff; --home: #fbbf24; --home-bg: #3a2e10;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 32px 16px 48px;
      }
      main { max-width: 1040px; margin: 0 auto; }
      header { margin-bottom: 28px; }
      h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
      header p { margin: 4px 0 0; color: var(--muted); }
      h2 {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted); margin: 32px 0 12px;
      }
      h2 small { text-transform: none; letter-spacing: 0; font-weight: normal; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
      a.card {
        display: block; padding: 14px 16px; background: var(--card); color: inherit;
        border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
        transition: border-color .15s, transform .15s;
      }
      a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
      .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .icon { font-size: 18px; }
      .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
      .url { color: var(--accent); font-size: 12px; margin-top: 6px; word-break: break-all; }
      .badge {
        font-size: 11px; font-weight: 600; color: var(--home); background: var(--home-bg);
        padding: 1px 7px; border-radius: 99px; margin-left: auto; white-space: nowrap;
      }
      table { width: 100%; border-collapse: collapse; background: var(--card);
              border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
      tr:last-child td { border-bottom: 0; }
      .scroll { overflow-x: auto; }
      code { font-size: 13px; }
      footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
    </style>
    </head>
    <body>
    <main>
      <header>
        <h1>Hinkel-Net</h1>
        <p>Raspberry Pi cluster &middot; links to everything running at home</p>
      </header>

      <h2>Anywhere</h2>
      <div class="grid">
        <a class="card" href="https://photos.hinkel-net.com">
          <div class="name"><span class="icon">📷</span>Photos</div>
          <div class="desc">Immich photo library</div>
          <div class="url">photos.hinkel-net.com</div>
        </a>
        <a class="card" href="https://ha.hinkel-net.com">
          <div class="name"><span class="icon">🏠</span>Home Assistant</div>
          <div class="desc">Smart home, Z-Wave devices</div>
          <div class="url">ha.hinkel-net.com</div>
        </a>
        <a class="card" href="https://portfolio.hinkel-net.com">
          <div class="name"><span class="icon">💼</span>Portfolio</div>
          <div class="desc">Personal website</div>
          <div class="url">portfolio.hinkel-net.com</div>
        </a>
        <a class="card" href="http://your-onion-address-goes-here.onion">
          <div class="name"><span class="icon">🧅</span>Onion site</div>
          <div class="desc">Open in Tor Browser</div>
          <div class="url">your-onion-address-goes-here.onion</div>
        </a>
      </div>

      <h2>Home network <small>&middot; only work at home or on the VPN</small></h2>
      <div class="grid">
        <a class="card" href="https://uptime.lan.hinkel-net.com">
          <div class="name"><span class="icon">📈</span>Uptime Kuma<span class="badge">home</span></div>
          <div class="desc">Up/down checks, phone alerts</div>
          <div class="url">uptime.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://grafana.lan.hinkel-net.com">
          <div class="name"><span class="icon">📊</span>Grafana<span class="badge">home</span></div>
          <div class="desc">Cluster dashboards</div>
          <div class="url">grafana.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://grafana.lan.hinkel-net.com/d/portfolio-visitors">
          <div class="name"><span class="icon">🌎</span>Visitors &amp; honeypot<span class="badge">home</span></div>
          <div class="desc">Who viewed the portfolio, what scanners try</div>
          <div class="url">grafana.lan.hinkel-net.com/d/portfolio-visitors</div>
        </a>
        <a class="card" href="https://longhorn.lan.hinkel-net.com">
          <div class="name"><span class="icon">💾</span>Longhorn<span class="badge">home</span></div>
          <div class="desc">Storage and volumes</div>
          <div class="url">longhorn.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://ha.lan.hinkel-net.com">
          <div class="name"><span class="icon">🏠</span>Home Assistant (local)<span class="badge">home</span></div>
          <div class="desc">Direct, without Cloudflare</div>
          <div class="url">ha.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://zwave.lan.hinkel-net.com">
          <div class="name"><span class="icon">📡</span>Z-Wave JS UI<span class="badge">home</span></div>
          <div class="desc">ZWA-2 stick on node3</div>
          <div class="url">zwave.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://auth.lan.hinkel-net.com">
          <div class="name"><span class="icon">🔑</span>Authentik<span class="badge">home</span></div>
          <div class="desc">Login, MFA and users for these apps</div>
          <div class="url">auth.lan.hinkel-net.com</div>
        </a>
        <a class="card" href="https://10.0.20.1">
          <div class="name"><span class="icon">🌐</span>Router<span class="badge">home</span></div>
          <div class="desc">UniFi Cloud Gateway Fiber</div>
          <div class="url">10.0.20.1</div>
        </a>
      </div>

      <h2>Cloud dashboards</h2>
      <div class="grid">
        <a class="card" href="https://dash.cloudflare.com">
          <div class="name"><span class="icon">☁️</span>Cloudflare</div>
          <div class="desc">DNS for hinkel-net.com</div>
          <div class="url">dash.cloudflare.com</div>
        </a>
        <a class="card" href="https://one.dash.cloudflare.com">
          <div class="name"><span class="icon">🔐</span>Cloudflare Zero Trust</div>
          <div class="desc">Tunnel routes and Access logins</div>
          <div class="url">one.dash.cloudflare.com</div>
        </a>
        <a class="card" href="https://unifi.ui.com">
          <div class="name"><span class="icon">🛰️</span>UniFi Site Manager</div>
          <div class="desc">Router from anywhere</div>
          <div class="url">unifi.ui.com</div>
        </a>
        <a class="card" href="https://us-east-2.console.aws.amazon.com/s3/buckets?region=us-east-2">
          <div class="name"><span class="icon">🪣</span>AWS S3 backups</div>
          <div class="desc">Nightly photo copies and encrypted cluster backups</div>
          <div class="url">s3.console.aws.amazon.com</div>
        </a>
      </div>

      <h2>Cluster nodes</h2>
      <div class="scroll">
        <table>
          <tr><th>Node</th><th>IP</th><th>Role</th></tr>
          <tr><td>master</td><td><code>10.0.20.240</code></td><td>k3s server, Longhorn disk</td></tr>
          <tr><td>node1</td><td><code>10.0.20.241</code></td><td>k3s agent, Longhorn disk</td></tr>
          <tr><td>node2</td><td><code>10.0.20.242</code></td><td>k3s server</td></tr>
          <tr><td>node3</td><td><code>10.0.20.243</code></td><td>k3s server, Z-Wave stick</td></tr>
        </table>
      </div>

      <footer>Served from the cluster &middot; edit <code>files/apps/homepage.yaml</code> in cluster-ansible to change this page</footer>
    </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: homepage-html
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: www.hinkel-net.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
---
# Home network name, behind the Authentik login (www keeps the Cloudflare Access login)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-lan
  namespace: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,authentik-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: home.lan.hinkel-net.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
