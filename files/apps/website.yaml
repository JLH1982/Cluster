# Portfolio website: https://portfolio.hinkel-net.com (via the Cloudflare tunnel)
# Site files live on the website-pvc volume (restored by playbooks/restore-data.yml).
# Page views are recorded by the visitor log (files/apps/visitor-log/).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: website-pvc
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 55Mi
---
# nginx:alpine's default site, plus a copy of each page request (not images, CSS or scripts) sent
# to the visitor log. The logger answers at once; if it is down, nginx still serves the site.
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-nginx
  namespace: default
data:
  default.conf: |
    # Pages: folders (/, /projects/), .html and .pdf files (e.g. a resume download) and paths
    # without a file extension (/about)
    map $request_uri $visitor_page {
        default                        0;
        "~^[^?]*/(\?|$)"               1;
        "~^[^?]*\.(html?|pdf)(\?|$)"   1;
        "~^[^?]*/[^/.?]+(\?|$)"        1;
    }

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            mirror /_visitor_log;
            mirror_request_body off;
        }

        location = /_visitor_log {
            internal;
            if ($visitor_page = 0) { return 204; }
            if ($request_method != GET) { return 204; }
            # Looked up per request (k3s DNS), so nginx starts even when the logger doesn't exist
            resolver 10.43.0.10 valid=60s ipv6=off;
            set $visitor_log http://visitor-log.visitor-log.svc.cluster.local:8080;
            proxy_pass $visitor_log;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: default
spec:
  replicas: 1
  # RWO volume: stop the old pod before starting the new one
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
      annotations:
        # Bump to restart nginx after changing website-nginx
        website/nginx-config-version: "1"
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: website
          persistentVolumeClaim:
            claimName: website-pvc
        - name: nginx-config
          configMap:
            name: website-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: default
spec:
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.hinkel-net.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
