# Authentik blueprint: the apps that sign in through Authentik. The worker re-applies it on start and
# when it changes, so edit it here rather than in the admin UI. Users, groups and MFA devices are not
# in here; they live in the database (backed up by backup.yml as authentik-db.dump).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  hinkel-net.yaml: |
    version: 1
    metadata:
      name: hinkel-net apps
    entries:
      # ---- Grafana: OpenID Connect (Grafana's own "Sign in with Authentik" button) ----
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers: {name: Grafana}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.lan.hinkel-net.com/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers: {slug: grafana}
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://grafana.lan.hinkel-net.com

      # ---- Everything else on *.lan.hinkel-net.com: Traefik asks Authentik before letting a request
      # through (forward auth, middleware authentik-authentik in 03-forward-auth.yaml). One login
      # covers all of them (cookie on lan.hinkel-net.com).
      - model: authentik_providers_proxy.proxyprovider
        id: lan-provider
        identifiers: {name: Home network apps}
        attrs:
          mode: forward_domain
          external_host: https://auth.lan.hinkel-net.com
          cookie_domain: lan.hinkel-net.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers: {slug: home-network}
        attrs:
          name: Home network apps
          provider: !KeyOf lan-provider
          meta_launch_url: https://home.lan.hinkel-net.com

      # The outpost built into the Authentik server answers Traefik's forward-auth checks
      - model: authentik_outposts.outpost
        identifiers: {managed: goauthentik.io/outposts/embedded}
        attrs:
          providers:
            - !KeyOf lan-provider
          config:
            authentik_host: https://auth.lan.hinkel-net.com
