# Traefik middleware that asks Authentik whether a visitor is signed in, and sends them to the
# Authentik login if not. Add it to a home-network Ingress with:
#   traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,authentik-authentik@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
