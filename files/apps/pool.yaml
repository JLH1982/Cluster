# Pool supply catalog - a static sample store page (not a real shop, nothing to order)
#   https://pool.hinkel-net.com (Cloudflare tunnel; route and DNS record set in the Cloudflare dashboard)
# Edit the HTML below and re-apply; the page updates within about a minute.
apiVersion: v1
kind: Namespace
metadata:
  name: pool
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pool-html
  namespace: pool
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Clearwater Pool Supply</title>
    <style>
      :root {
        --bg: #f4f8fb; --surface: #ffffff; --text: #13202c; --muted: #5b6b79;
        --border: #dbe5ec; --accent: #0b6fa4; --accent-soft: #e2f1f9; --price: #0b5c86;
        --hero-1: #0b6fa4; --hero-2: #1aa3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1820; --surface: #14232e; --text: #e6eef3; --muted: #9db0bd;
          --border: #24394a; --accent: #4bb3e3; --accent-soft: #173445; --price: #7fcdf0;
          --hero-1: #0a4f75; --hero-2: #0f7383;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
      header.hero { background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; }
      .hero .wrap { padding-top: 48px; padding-bottom: 40px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; letter-spacing: .02em; }
      .brand svg { flex: none; }
      .hero h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: 1.15; margin: 28px 0 12px; max-width: 18ch; }
      .hero p { margin: 0; max-width: 56ch; opacity: .92; font-size: 1.05rem; }
      .facts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 24px; font-size: .95rem; opacity: .92; }
      nav.cats { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--border); }
      nav.cats .wrap { display: flex; gap: 4px; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; }
      nav.cats a { white-space: nowrap; color: var(--text); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
      nav.cats a:hover, nav.cats a:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
      main section { padding-top: 40px; scroll-margin-top: 56px; }
      .section-head h2 { margin: 0; font-size: 1.5rem; }
      .section-head p { margin: 4px 0 16px; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
        display: flex; flex-direction: column; gap: 8px; }
      .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
      .size { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
      .desc { margin: 0; flex: 1; font-size: .95rem; }
      .price { margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--price); font-variant-numeric: tabular-nums; }
      .tag { display: inline-block; margin-bottom: 6px; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600;
        background: var(--accent-soft); color: var(--accent); }
      .visit { margin-top: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 32px; }
      .visit h2 { margin: 0 0 4px; font-size: 1.2rem; }
      .visit p { margin: 0; color: var(--muted); }
      .visit dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; }
      .visit dt { font-weight: 600; } .visit dd { margin: 0; color: var(--muted); }
      footer { padding: 32px 0 48px; color: var(--muted); font-size: .85rem; }
    </style>
    </head>
    <body>
    <header class="hero">
      <div class="wrap">
        <div class="brand">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fff" fill-opacity=".18"/><path d="M5 18c2.5 0 2.5-2 5.5-2s3 2 5.5 2 2.5-2 5.5-2 3 2 5.5 2M5 23c2.5 0 2.5-2 5.5-2s3 2 5.5 2 2.5-2 5.5-2 3 2 5.5 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="10" r="3" fill="#fff"/></svg>
          Clearwater Pool Supply
        </div>
        <h1>Everything your pool needs, all season long</h1>
        <p>Chemicals, test kits, cleaning tools, parts and safety gear for in-ground and above-ground pools. Prices below are per item, in store.</p>
        <div class="facts"><span>40 products in stock</span><span>Free water testing</span><span>Open daily in season</span></div>
      </div>
    </header>
    <nav class="cats" aria-label="Product categories"><div class="wrap"><a href="#chemicals">Water chemicals</a><a href="#testing">Water testing</a><a href="#cleaning">Cleaning tools</a><a href="#equipment">Equipment and parts</a><a href="#covers">Covers and comfort</a><a href="#safety">Safety</a></div></nav>
    <main class="wrap">
        <section id="chemicals">
          <div class="section-head"><h2>Water chemicals</h2><p>Sanitizers, balancers and treatments to keep water clear and safe.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><span class="tag">Best seller</span><h3>3&quot; chlorine tablets</h3><p class="size">Stabilized trichlor, 25 lb bucket</p></div>
              <p class="desc">Slow-dissolving tablets for feeders and floaters.</p>
              <p class="price">$119.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Liquid chlorine 12.5%</h3><p class="size">2 x 1 gal</p></div>
              <p class="desc">Fast-acting sanitizer with no added stabilizer.</p>
              <p class="price">$14.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Cal-hypo shock 73%</h3><p class="size">12 x 1 lb bags</p></div>
              <p class="desc">Weekly shock for clearing cloudy water.</p>
              <p class="price">$54.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Non-chlorine shock</h3><p class="size">MPS oxidizer, 2 lb</p></div>
              <p class="desc">Swim again in 15 minutes.</p>
              <p class="price">$19.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>pH increaser</h3><p class="size">Soda ash, 10 lb</p></div>
              <p class="desc">Raises low pH.</p>
              <p class="price">$24.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>pH decreaser</h3><p class="size">Dry acid, 10 lb</p></div>
              <p class="desc">Lowers high pH and alkalinity.</p>
              <p class="price">$27.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Alkalinity increaser</h3><p class="size">Sodium bicarbonate, 12 lb</p></div>
              <p class="desc">Steadies pH swings.</p>
              <p class="price">$22.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Calcium hardness increaser</h3><p class="size">Calcium chloride, 15 lb</p></div>
              <p class="desc">Protects plaster and heaters.</p>
              <p class="price">$29.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Stabilizer</h3><p class="size">Cyanuric acid, 4 lb</p></div>
              <p class="desc">Shields chlorine from sunlight.</p>
              <p class="price">$26.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Algaecide 60%</h3><p class="size">Polyquat, 1 qt</p></div>
              <p class="desc">Non-foaming weekly prevention.</p>
              <p class="price">$24.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Water clarifier</h3><p class="size">1 qt</p></div>
              <p class="desc">Clumps fine particles so the filter can catch them.</p>
              <p class="price">$16.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Pool salt</h3><p class="size">99.8% pure, 40 lb</p></div>
              <p class="desc">For saltwater chlorine generators.</p>
              <p class="price">$9.99</p>
            </article>
          </div>
        </section>
        <section id="testing">
          <div class="section-head"><h2>Water testing</h2><p>Know your numbers before you add chemicals.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><h3>4-in-1 test strips</h3><p class="size">50 strips</p></div>
              <p class="desc">Free chlorine, pH, alkalinity, stabilizer.</p>
              <p class="price">$12.99</p>
            </article>
            <article class="card">
              <div class="card-top"><span class="tag">Best seller</span><h3>7-way test strips</h3><p class="size">100 strips</p></div>
              <p class="desc">Adds hardness, total chlorine and bromine.</p>
              <p class="price">$19.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>OTO / phenol red kit</h3><p class="size">Drop test</p></div>
              <p class="desc">Basic chlorine and pH check.</p>
              <p class="price">$14.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Complete drop test kit</h3><p class="size">FAS-DPD</p></div>
              <p class="desc">Lab-style accuracy for chlorine, pH, TA, CH, CYA.</p>
              <p class="price">$69.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Digital pH and ORP tester</h3><p class="size">Pocket meter</p></div>
              <p class="desc">Instant readings, waterproof.</p>
              <p class="price">$89.99</p>
            </article>
          </div>
        </section>
        <section id="cleaning">
          <div class="section-head"><h2>Cleaning tools</h2><p>Brushes, nets and vacuums for walls, floor and surface.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><h3>Telescoping pole</h3><p class="size">8 to 16 ft, aluminum</p></div>
              <p class="desc">Fits every head and net on this page.</p>
              <p class="price">$39.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Leaf skimmer net</h3><p class="size">Flat, fine mesh</p></div>
              <p class="desc">Daily surface cleaning.</p>
              <p class="price">$16.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Leaf rake</h3><p class="size">Deep bag</p></div>
              <p class="desc">Scoops heavy leaf loads from the floor.</p>
              <p class="price">$24.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Wall and floor brush</h3><p class="size">18&quot;, nylon</p></div>
              <p class="desc">Safe for vinyl, fiberglass and plaster.</p>
              <p class="price">$19.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Algae brush</h3><p class="size">10&quot;, stainless steel</p></div>
              <p class="desc">Plaster pools only.</p>
              <p class="price">$22.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Vacuum head</h3><p class="size">14&quot;, weighted</p></div>
              <p class="desc">Manual vacuuming with your pump.</p>
              <p class="price">$29.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Vacuum hose</h3><p class="size">1.5&quot; x 35 ft</p></div>
              <p class="desc">Swivel cuff, kink resistant.</p>
              <p class="price">$44.99</p>
            </article>
            <article class="card">
              <div class="card-top"><span class="tag">Best seller</span><h3>Robotic pool cleaner</h3><p class="size">Floor, walls and waterline</p></div>
              <p class="desc">Plug-in cleaner with its own filter, 2-hour cycle.</p>
              <p class="price">$699.00</p>
            </article>
          </div>
        </section>
        <section id="equipment">
          <div class="section-head"><h2>Equipment and parts</h2><p>Pumps, filters and the parts that wear out.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><h3>Variable-speed pump</h3><p class="size">1.5 HP</p></div>
              <p class="desc">Runs slow and quiet, cuts power use.</p>
              <p class="price">$1,149.00</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Cartridge filter element</h3><p class="size">100 sq ft</p></div>
              <p class="desc">Replace every 1 to 2 seasons.</p>
              <p class="price">$59.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Filter sand</h3><p class="size">#20 silica, 50 lb</p></div>
              <p class="desc">Sand filter media.</p>
              <p class="price">$24.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Salt chlorine cell</h3><p class="size">Up to 40,000 gal</p></div>
              <p class="desc">Replacement cell for saltwater systems.</p>
              <p class="price">$649.00</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Inline chlorinator</h3><p class="size">Automatic, holds 9 lb</p></div>
              <p class="desc">Feeds tablets after the filter.</p>
              <p class="price">$119.00</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Skimmer basket</h3><p class="size">Standard size</p></div>
              <p class="desc">Catches leaves before the pump does.</p>
              <p class="price">$14.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Pump lid O-ring</h3><p class="size">Universal fit</p></div>
              <p class="desc">Stops air leaks at the strainer.</p>
              <p class="price">$6.99</p>
            </article>
          </div>
        </section>
        <section id="covers">
          <div class="section-head"><h2>Covers and comfort</h2><p>Keep heat in and debris out.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><h3>Solar cover</h3><p class="size">16 x 32 ft, 12 mil</p></div>
              <p class="desc">Warms water up to 15 F.</p>
              <p class="price">$129.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Winter cover</h3><p class="size">16 x 32 ft</p></div>
              <p class="desc">Off-season protection with water bags.</p>
              <p class="price">$149.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Floating chlorinator</h3><p class="size">Holds 3&quot; tablets</p></div>
              <p class="desc">Adjustable vents.</p>
              <p class="price">$12.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Pool thermometer</h3><p class="size">Floating, with cord</p></div>
              <p class="desc">Easy-read dial.</p>
              <p class="price">$9.99</p>
            </article>
          </div>
        </section>
        <section id="safety">
          <div class="section-head"><h2>Safety</h2><p>Required gear and peace of mind.</p></div>
          <div class="grid">
            <article class="card">
              <div class="card-top"><h3>Pool alarm</h3><p class="size">Wave sensor</p></div>
              <p class="desc">Sounds when something enters the water.</p>
              <p class="price">$129.00</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Life ring</h3><p class="size">24&quot;, with 60 ft rope</p></div>
              <p class="desc">Coast Guard style ring buoy.</p>
              <p class="price">$49.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Shepherd&#x27;s hook</h3><p class="size">Fits standard poles</p></div>
              <p class="desc">Reach-and-pull rescue hook.</p>
              <p class="price">$29.99</p>
            </article>
            <article class="card">
              <div class="card-top"><h3>Rope and float line</h3><p class="size">25 ft</p></div>
              <p class="desc">Marks the shallow-to-deep break.</p>
              <p class="price">$34.99</p>
            </article>
          </div>
        </section>
      <section class="visit" aria-label="Store information">
        <div><h2>Free water testing</h2><p>Bring a sample from elbow depth; we test it while you wait and print what to add.</p></div>
        <div><h2>Store hours</h2>
          <dl><dt>Mon to Fri</dt><dd>9 am to 7 pm</dd><dt>Saturday</dt><dd>9 am to 6 pm</dd><dt>Sunday</dt><dd>10 am to 4 pm</dd></dl></div>
        <div><h2>Season</h2><p>Open daily May through September, weekends only the rest of the year.</p></div>
      </section>
    </main>
    <footer class="wrap">Sample catalog for demonstration only: not a real store, nothing can be ordered here, and prices are illustrative.</footer>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool
  namespace: pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pool
  template:
    metadata:
      labels:
        app: pool
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: pool-html
---
apiVersion: v1
kind: Service
metadata:
  name: pool
  namespace: pool
spec:
  selector:
    app: pool
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pool
  namespace: pool
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: pool.hinkel-net.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pool
                port:
                  name: http
