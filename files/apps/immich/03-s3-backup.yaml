# Nightly off-site copy of the Immich data folder (original photos/videos in upload/, Immich's own
# daily database dumps in backups/, thumbnails) to the S3 bucket <your-immich-backup-bucket> (us-east-2).
# The bucket is versioned: deleted or changed files stay recoverable for 90 days.
# Credentials and the Uptime Kuma push URL are in the immich-s3-backup secret (from the vault).
# Run now:  kubectl -n immich create job --from=cronjob/immich-s3-backup immich-s3-backup-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-s3-backup
  namespace: immich
spec:
  schedule: "30 3 * * *"          # after Immich's own 02:00 database dump
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          # The library volume is ReadWriteOnce, so run on the Pi where Immich has it mounted
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: immich
                      app.kubernetes.io/name: server
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  rclone sync /data ":s3,provider=AWS,env_auth=true,region=us-east-2,no_check_bucket=true:<your-immich-backup-bucket>/immich-data" \
                    --exclude "lost+found/**" --transfers 4 --checkers 8 --stats-one-line --stats 1m -v
                  wget -q -O /dev/null "$KUMA_PUSH_URL"
                  echo "Backup finished and reported to Uptime Kuma"
              envFrom:
                - secretRef:
                    name: immich-s3-backup
              env:
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: immich-library
                readOnly: true
            - name: tmp
              emptyDir: {}
