# https://longhorn.lan.hinkel-net.com, behind the Authentik login.
# Fallback if Authentik is down: change the middleware below to
# traefik-redirect-https@kubernetescrd,longhorn-system-longhorn-auth@kubernetescrd (the old password login).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: longhorn-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: longhorn-basic-auth   # credentials in /home/kube/longhorn-ui-credentials.txt
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd,authentik-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: longhorn.lan.hinkel-net.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
