apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.0.20.230-10.0.20.239 
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
  # Pis are also on Wi-Fi (wlan0) in the same subnet; only announce LoadBalancer IPs on the wired port
  interfaces:
    - eth0
