# k3s-alerts.yaml
# Alert rules designed for K3s clusters in production

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k3s-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: k3s-cluster-health
      rules:
        # Alert when a K3s node becomes unreachable
        - alert: K3sNodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "K3s node {{ $labels.instance }} is down"
            description: "The node has been unreachable for more than 5 minutes."

        # Alert on high CPU usage across the cluster
        - alert: K3sHighCPUUsage
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage has been above 85% for 10 minutes."

        # Alert when memory is running low
        - alert: K3sLowMemory
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Low memory on {{ $labels.instance }}"
            description: "Available memory is below 15%."

        # Alert on disk space running low
        - alert: K3sDiskSpaceLow
          expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Low disk space on {{ $labels.instance }}"
            description: "Disk space is below 20% on root filesystem."

        # Alert on too many pod restarts
        - alert: K3sPodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
            description: "Pod has restarted more than 5 times in the last hour."

        # Alert when API server latency is high
        # Same as "99th percentile above 1s": more than 1% of requests took longer than 1s.
        # Only the 1s and +Inf buckets are kept (see kubeApiServer in helm-values/prometheus.yaml).
        - alert: K3sAPIServerLatencyHigh
          expr: |
            (
              sum(rate(apiserver_request_duration_seconds_bucket{le="+Inf",verb!~"WATCH|CONNECT"}[5m]))
              - sum(rate(apiserver_request_duration_seconds_bucket{le="1.0",verb!~"WATCH|CONNECT"}[5m]))
            ) / sum(rate(apiserver_request_duration_seconds_bucket{le="+Inf",verb!~"WATCH|CONNECT"}[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "K3s API server latency is high"
            description: "99th percentile API latency is above 1 second."

    - name: prometheus-storage
      rules:
        # Prometheus's disk filled on 2026-10-22 and it silently stopped saving data for a day.
        - alert: PrometheusDiskFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim=~"prometheus-.*"} < 0.20
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus disk is over 80% full"
            description: "{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free. Raise storage or lower retentionSize in helm-values/prometheus.yaml."

        # Works even when the disk is full: no new samples means the node-exporter series go stale
        # and absent() becomes true.
        - alert: PrometheusNotSavingData
          expr: absent(up{job="node-exporter"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus has stored no fresh data for 10 minutes"
            description: "Grafana charts will be empty. Check the Prometheus logs (disk full, crash loop, or scraping broken)."

    - name: k3s-workload-health
      rules:
        # Alert when deployments have no available replicas
        - alert: K3sDeploymentUnavailable
          expr: kube_deployment_status_replicas_available == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"
            description: "All replicas are unavailable for this deployment."

        # Alert on pending pods
        - alert: K3sPodPending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is pending"
            description: "Pod has been in Pending state for more than 15 minutes."
