# Grafana dashboard "Cluster Problems": warnings and errors from the Pis' system journal, k3s/etcd,
# Kubernetes events, pods and fail2ban (Loki, see helm-values/loki.yaml and alloy.yaml), with reboots,
# uptime, temperatures and container restarts from Prometheus. Loaded by the Grafana dashboard
# sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-problems
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-problems.json: |
    {
      "uid": "cluster-problems",
      "title": "Cluster Problems",
      "tags": [
        "cluster",
        "logs"
      ],
      "description": "Warnings, errors, reboots, restarts and fail2ban from the Pis and k3s (Loki: helm-values/loki.yaml, alloy.yaml).",
      "timezone": "America/Chicago",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "graphTooltip": 1,
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Reboots",
            "enable": true,
            "iconColor": "red",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "target": {
              "refId": "Anno",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(node_boot_time_seconds - min_over_time(node_boot_time_seconds[10m]) > 60) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"}",
              "legendFormat": "{{nodename}} started"
            },
            "step": "60s",
            "titleFormat": "Reboot",
            "textFormat": "{{nodename}} started",
            "useValueForTime": false
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "node",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "",
              "type": 1
            },
            "definition": "label_values(node)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "hide": 0,
            "sort": 1
          },
          {
            "name": "search",
            "label": "Search",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Summary",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Errors",
          "description": "Error-level lines from the Pis' system journal (kernel, k3s, etcd, services).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({source=\"journal\", node=~\"$node\", level=~\"emerg|alert|crit|err|error|fatal|panic\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "Warnings",
          "description": "Warning-level lines from the Pis' system journal.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({source=\"journal\", node=~\"$node\", level=~\"warning|warn\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3
        },
        {
          "type": "stat",
          "title": "Pod errors",
          "description": "Lines from app logs that look like errors or warnings.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({source=\"pod\", node=~\"$node\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 4
        },
        {
          "type": "stat",
          "title": "Reboots",
          "description": "Times a Pi started up in the time range (planned or not). See the uptime and timeline below.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(changes(round(node_boot_time_seconds, 300)[$__range:5m]) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 5
        },
        {
          "type": "stat",
          "title": "Container restarts",
          "description": "Containers that crashed or were killed and restarted.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(round(increase(kube_pod_container_status_restarts_total[$__range])))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 6
        },
        {
          "type": "stat",
          "title": "fail2ban bans",
          "description": "IP addresses banned for failed SSH logins. SSH is only open to the home network and VPN, so any ban is one of your own devices or something on your network.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({unit=\"fail2ban.service\", node=~\"$node\"} |= \"] Ban \" [$__range]))",
              "queryType": "instant"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 7
        },
        {
          "id": 8,
          "type": "row",
          "title": "Timeline",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "timeseries",
          "title": "Problems per node",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Warning and error lines per Pi (system journal and pods). Red markers: reboots.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (node) (count_over_time({source=~\"journal|pod\", node=~\"$node\"} |~ \"(?i)$search\" [$__interval]))",
              "queryType": "range",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 70,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 1
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 6
          },
          "id": 9
        },
        {
          "type": "stat",
          "title": "Uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Time since each Pi last started.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time() - node_boot_time_seconds) * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"}",
              "legendFormat": "{{nodename}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 86400
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "orientation": "horizontal",
            "justifyMode": "auto"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "id": 10
        },
        {
          "type": "timeseries",
          "title": "CPU temperature",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Pi 5s slow down from 85 °C (throttling); the firmware doesn't log it, so watch for it here.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (nodename) (node_hwmon_temp_celsius{chip=\"thermal_thermal_zone0\"} * on (instance) group_left (nodename) node_uname_info{nodename=~\"$node\"})",
              "legendFormat": "{{nodename}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": 30,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "id": 11
        },
        {
          "type": "table",
          "title": "Container restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Containers that restarted in the time range, most first.",
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort_desc(round(sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[$__range]))) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "container": "Container",
                  "Value": "Restarts"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "id": 12
        },
        {
          "id": 13,
          "type": "row",
          "title": "Logs",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          }
        },
        {
          "type": "logs",
          "title": "Hardware, power and disks",
          "description": "Under-voltage, heat, USB/disk resets and errors, out of memory, boots and shutdowns. After an unexpected reset, look just before the \"Booting Linux\" line.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{source=\"journal\", node=~\"$node\"} |~ \"(?i)(under-?voltage|throttl|thermal|over-?temp|reset (high|super|full|low)[ -]?speed|disconnect|i/o error|ext4-fs|nvme|out of memory|oom-kill|killed process|watchdog|booting linux|system is (rebooting|powering down)|reached target.*(reboot|power-off|shutdown))\" |~ \"(?i)$search\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "id": 14
        },
        {
          "type": "logs",
          "title": "k3s and etcd",
          "description": "Warnings and errors from k3s (Kubernetes) and its etcd database: slow disk writes, leader changes, API errors.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{unit=~\"k3s.*\", node=~\"$node\"} |~ \"(?i)$search\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "id": 15
        },
        {
          "type": "logs",
          "title": "Kubernetes events",
          "description": "Warning events (crash loops, out of memory, failed mounts, scheduling) and nodes going not ready / rebooting.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{source=\"events\"} |~ \"(?i)$search\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "id": 16
        },
        {
          "type": "logs",
          "title": "Security: fail2ban and failed SSH logins",
          "description": "Bans and unbans, and the failed logins that led to them.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{unit=\"fail2ban.service\", node=~\"$node\"} |~ \"(?i)$search\"",
              "queryType": "range"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{source=\"journal\", node=~\"$node\"} |~ \"(?i)(failed password|invalid user|authentication failure)\" |~ \"(?i)$search\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "id": 17
        },
        {
          "type": "logs",
          "title": "Pod errors and warnings",
          "description": "Error and warning lines from app logs. Expand a line for its namespace, pod and container.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
