# Grafana dashboard "Visitors & Honeypot": a world map and tables of who opened the portfolio and
# www, what scanners probe for, and the admin.hinkel-net.com honeypot - switched with the Source
# dropdown. Data: the visitor log (files/apps/visitor-log/) through the "Portfolio visitors"
# datasource (helm-values/prometheus.yaml). Loaded by the Grafana dashboard sidecar (label
# grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-portfolio-visitors
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portfolio-visitors.json: |
    {
      "uid": "portfolio-visitors",
      "title": "Visitors & Honeypot",
      "tags": [
        "portfolio",
        "honeypot"
      ],
      "description": "Who opened portfolio.hinkel-net.com and www, what scanners probe for, and the admin.hinkel-net.com honeypot (visitor log: files/apps/visitor-log/).",
      "timezone": "America/Chicago",
      "editable": true,
      "schemaVersion": 39,
      "version": 3,
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "refresh": "5m",
      "graphTooltip": 0,
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "source",
            "label": "Source",
            "type": "custom",
            "query": "Portfolio visitors : portfolio,Portfolio probes : probes,Honeypot (admin) : honeypot,www login page : www,Blocked by Cloudflare : blocked",
            "multi": true,
            "includeAll": true,
            "hide": 0,
            "current": {
              "text": [
                "Portfolio visitors"
              ],
              "value": [
                "portfolio"
              ]
            },
            "options": [
              {
                "text": "All",
                "value": "$__all",
                "selected": false
              },
              {
                "text": "Portfolio visitors",
                "value": "portfolio",
                "selected": true
              },
              {
                "text": "Portfolio probes",
                "value": "probes",
                "selected": false
              },
              {
                "text": "Honeypot (admin)",
                "value": "honeypot",
                "selected": false
              },
              {
                "text": "www login page",
                "value": "www",
                "selected": false
              },
              {
                "text": "Blocked by Cloudflare",
                "value": "blocked",
                "selected": false
              }
            ]
          },
          {
            "name": "search",
            "label": "Search (company, domain, city, path)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0
          },
          {
            "name": "bots",
            "label": "Bots on the portfolio",
            "type": "custom",
            "query": "Hide : false,Show : true",
            "current": {
              "text": "Hide",
              "value": "false"
            },
            "options": [
              {
                "text": "Hide",
                "value": "false",
                "selected": true
              },
              {
                "text": "Show",
                "value": "true",
                "selected": false
              }
            ],
            "hide": 0,
            "multi": false,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests",
          "description": "Page views, probes and honeypot requests in the time range (Cloudflare's numbers are estimates from samples).",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "portfolio-visitors"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT coalesce(sum(hits), 0) AS requests FROM visit_sources WHERE $__timeFilter(ts) AND source IN (${source:sqlstring}) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "IP addresses",
          "description": "Different IPs. Visitor IPs are deleted after 7 days and attacker IPs after 90, so older requests don't count here.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "portfolio-visitors"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT count(DISTINCT ip) AS ips FROM visit_sources WHERE $__timeFilter(ts) AND source IN (${source:sqlstring}) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Organisations",
          "description": "Different networks (IP-block owner or Cloudflare's network name, else reverse-DNS domain).",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "portfolio-visitors"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT count(DISTINCT coalesce(org, domain)) AS orgs FROM visit_sources WHERE $__timeFilter(ts) AND source IN (${source:sqlstring}) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Last seen",
          "description": "Most recent request.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "portfolio-visitors"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT max(ts) AS last FROM visit_sources WHERE $__timeFilter(ts) AND source IN (${source:sqlstring}) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "dateTimeFromNow"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 5,
          "type": "geomap",
          "title": "🔵 Portfolio visitors   🔴 Honeypot (admin)   🟣 Portfolio probes   🟢 www login page   🟠 Blocked by Cloudflare",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "portfolio-visitors"
          },
          "description": "One colour per source; turn sources on and off with the Source dropdown above. Portfolio and honeypot dots are cities. www and blocked dots are countries, because Cloudflare gives no city for requests it answers itself. Bigger dots had more requests; the number shows when more than one.",
          "gridPos": {
            "h": 15,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "blocked",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT country, sum(hits) AS requests, 'Blocked by Cloudflare' AS source, CASE WHEN sum(hits) > 1 THEN sum(hits)::text ELSE '' END AS label\nFROM visit_sources WHERE source = 'blocked' AND 'blocked' IN (${source:sqlstring})\n  AND country IS NOT NULL AND $__timeFilter(ts) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'\nGROUP BY country"
            },
            {
              "refId": "www",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT country, sum(hits) AS requests, 'www login page' AS source, CASE WHEN sum(hits) > 1 THEN sum(hits)::text ELSE '' END AS label\nFROM visit_sources WHERE source = 'www' AND 'www' IN (${source:sqlstring})\n  AND country IS NOT NULL AND $__timeFilter(ts) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'\nGROUP BY country"
            },
            {
              "refId": "probes",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT city, region, country, lat AS latitude, lon AS longitude, sum(hits) AS requests, 'Portfolio probes' AS source, CASE WHEN sum(hits) > 1 THEN sum(hits)::text ELSE '' END AS label\nFROM visit_sources WHERE source = 'probes' AND 'probes' IN (${source:sqlstring})\n  AND lat IS NOT NULL AND $__timeFilter(ts) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'\nGROUP BY city, region, country, lat, lon"
            },
            {
              "refId": "honeypot",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT city, region, country, lat AS latitude, lon AS longitude, sum(hits) AS requests, 'Honeypot (admin)' AS source, CASE WHEN sum(hits) > 1 THEN sum(hits)::text ELSE '' END AS label\nFROM visit_sources WHERE source = 'honeypot' AND 'honeypot' IN (${source:sqlstring})\n  AND lat IS NOT NULL AND $__timeFilter(ts) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'\nGROUP BY city, region, country, lat, lon"
            },
            {
              "refId": "portfolio",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "portfolio-visitors"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT city, region, country, lat AS latitude, lon AS longitude, sum(hits) AS requests, 'Portfolio visitors' AS source, CASE WHEN sum(hits) > 1 THEN sum(hits)::text ELSE '' END AS label\nFROM visit_sources WHERE source = 'portfolio' AND 'portfolio' IN (${source:sqlstring})\n  AND lat IS NOT NULL AND $__timeFilter(ts) AND (${bots} OR NOT bot OR source <> 'portfolio') AND concat_ws(' ', org, domain, hostname, city, region, country, path, username) ILIKE '%' || ${search:sqlstring} || '%'\nGROUP BY city, region, country, lat, lon"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "view": {
              "id": "coords",
              "lat": 30,
              "lon": -40,
              "zoom": 2.2,
              "allLayers": true
            },
            "controls": {
              "showZoom": true,
              "mouseWheelZoom": true,
              "showAttribution": true
            },
            "basemap": {
              "type": "default",
              "name": "Basemap",
              "config": {}
            },
            "tooltip": {
              "mode": "details"
            },
            "layers": [
              {
                "type": "markers",
                "name": "Blocked by Cloudflare",
                "tooltip": true,
                "location": {
