# Let's Encrypt wildcard certificate for the home-network names (*.lan.hinkel-net.com).
# cert-manager proves ownership of hinkel-net.com with a temporary DNS record (DNS-01), using the
# cloudflare-api-token secret (vault_cloudflare_dns_token: a Cloudflare API token that can only edit
# DNS in hinkel-net.com). Nothing has to be reachable from the internet. Renews itself 30 days
# before expiry. Traefik serves it as its default certificate (tlsStore in helm-values/traefik.yaml).
# Public DNS: *.lan.hinkel-net.com is a DNS-only (grey cloud) A record to 10.0.20.230, so the names
# resolve everywhere but only work at home or over the VPN.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-wildcard
  namespace: traefik
spec:
  secretName: lan-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - lan.hinkel-net.com
    - "*.lan.hinkel-net.com"
---
# Sends http:// visits to https://. Used only by the home-network Ingresses: the Cloudflare tunnel
# reaches the public names over plain http, so they must not be redirected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
