# Grafana Alloy on every Pi: sends only problems to Loki (loki.yaml) - the system journal at
# warning or worse plus known trouble signs (under-voltage, USB/disk resets, out of memory, boots),
# fail2ban, failed SSH logins, k3s/etcd warnings and errors, and pod log lines that look like errors.
# Kubernetes events are collected once for the cluster by a second release (alloy-events.yaml).
alloy:
  configMap:
    content: |
      // Runs on every Pi. Sends only problems to Loki: the system journal at warning or worse (plus a
      // few info-level trouble signs), fail2ban, and pod log lines that look like errors or warnings.

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc:3100/loki/api/v1/push"
        }
      }

      // ---- Pi system journal ----
      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__transport"]
          regex         = "kernel"
          target_label  = "unit"
          replacement   = "kernel"
        }
        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "identifier"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
      }

      loki.source.journal "pi" {
        path          = "/var/log/journal"
        max_age       = "12h"
        relabel_rules = loki.relabel.journal.rules
        labels        = {source = "journal", node = sys.env("NODE_NAME")}
        forward_to    = [loki.process.journal.receiver]
      }

      loki.process "journal" {
        // k3s (and its embedded etcd) logs everything at "info": take the real level from the message
        stage.match {
          selector = "{unit=~\"k3s.*\"}"

          stage.regex {
            expression = "(?:level=|\"level\":\")(?P<msg_level>[a-z]+)"
          }
          stage.labels {
            values = {level = "msg_level"}
          }
        }
        stage.match {
          selector = "{unit=~\"k3s.*\"} |~ `^E[0-9]{4} `"
          stage.static_labels {
            values = {level = "error"}
          }
        }
        stage.match {
          selector = "{unit=~\"k3s.*\"} |~ `^W[0-9]{4} `"
          stage.static_labels {
            values = {level = "warning"}
          }
        }
        stage.match {
          selector = "{unit=~\"k3s.*\"} |~ `^F[0-9]{4} `"
          stage.static_labels {
            values = {level = "fatal"}
          }
        }

        // Drop routine messages. Kept anyway: fail2ban (bans and failed logins) and info-level signs of
        // trouble - power, heat, USB/disk resets and errors, out of memory, failed SSH logins, boots and
        // shutdowns, etcd leader changes and slow disk writes.
        stage.match {
          selector            = "{source=\"journal\", level=~\"notice|info|debug|\", unit!=\"fail2ban.service\"} !~ `(?i)(under-?voltage|throttl|thermal|over-?temp|reset (high|super|full|low)[ -]?speed|usb [0-9-.]+: (usb )?disconnect|i/o error|ext4-fs (error|warning)|nvme.*(timeout|reset|abort)|out of memory|oom-kill|killed process|watchdog|failed password|invalid user|authentication failure|booting linux|system is (rebooting|powering down)|reached target.*(reboot|power-off|shutdown)|unattended-upgrade.*reboot|leader changed|elected leader|apply request took too long|slow fdatasync)`"
          action              = "drop"
          drop_counter_reason = "not_a_problem"
        }

        forward_to = [loki.write.default.receiver]
      }

      // ---- Pod logs on this Pi ----
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Loki and Alloy themselves: an error pushing logs would otherwise create more logs to push
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "logging"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "^;*([^;]+).*$"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}

        stage.static_labels {
          values = {source = "pod", node = sys.env("NODE_NAME")}
        }
        stage.label_drop {
          values = ["filename"]
        }

        // Keep only lines that look like errors or warnings (levels, upper-case words, Kubernetes'
        // E0102-style prefixes, stack traces)
        stage.match {
          selector            = "{source=\"pod\"} !~ `((?i:level\"?[=:] ?\"?(error|err|warn|warning|fatal|panic|crit|critical)[\" ,])|(^|[^A-Za-z])(ERROR|FATAL|PANIC|CRITICAL|WARN|WARNING)([^A-Za-z]|$)|^[EWF][0-9]{4} |Traceback|Exception|panic:|OOMKilled)`"
          action              = "drop"
          drop_counter_reason = "not_a_problem"
        }

        forward_to = [loki.write.default.receiver]
      }

  # Remembers how far each log was read, across restarts (a folder on the Pi)
  storagePath: /var/lib/alloy/data
  enableReporting: false
  # The journal and /var/log/pods are only readable by root
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  mounts:
    varlog: true   # /var/log: the journal (kept on disk, see files/host/journald) and pod logs
    extra:
      - {name: machine-id, mountPath: /etc/machine-id, readOnly: true}
      - {name: alloy-data, mountPath: /var/lib/alloy/data}
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef: {fieldPath: spec.nodeName}
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

controller:
  type: daemonset
  # Also on tainted nodes, so every Pi is covered
  tolerations:
    - operator: Exists
  volumes:
    extra:
      - name: machine-id
        hostPath: {path: /etc/machine-id, type: File}
      - name: alloy-data
        hostPath: {path: /var/lib/alloy, type: DirectoryOrCreate}

# Only what this config uses (the chart's default can also read every Secret)
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "list", "watch"]
