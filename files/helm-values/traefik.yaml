service:
  annotations:
    # Keep the same LAN IP after a rebuild: Cloudflare tunnel routes point at it
    metallb.io/loadBalancerIPs: 10.0.20.230
# HTTPS certificate for every host: the *.lan.hinkel-net.com wildcard from
# files/platform/lan-certificate.yaml (Traefik's self-signed one until it is issued)
# No 60-second limit on reading a request (Traefik v3's default), so large Immich video
# uploads don't get cut off part way
ports:
  web:
    transport:
      respondingTimeouts:
        readTimeout: 0
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 0
tlsStore:
  default:
    defaultCertificate:
      secretName: lan-wildcard-tls
# Two copies on different Pis, so a reboot (e.g. the nightly unattended-upgrades one) or a
# dead Pi doesn't take every site down. The PDB stops a drain from removing both at once.
deployment:
  replicas: 2
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname
